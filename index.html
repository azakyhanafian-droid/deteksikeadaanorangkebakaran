<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Smart Monitor - Dashboard</title>

    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>

  <body>
    <div class="wrapper">
      <!-- HEADER -->
      <header class="app-header">
        <div class="header-content">
          <div class="header-left">
            <div class="logo">
              <i class="fas fa-shield-halved"></i>
              <h1>AI Smart Monitor</h1>
            </div>
            <p class="tagline">Fire & Smoke Detection System</p>
          </div>
          <div id="status" class="status-badge">Menghubungkan...</div>
        </div>
      </header>

      <!-- MAIN CONTENT -->
      <main class="app-main">
        <!-- SENSORS GRID -->
        <section class="sensors-section">
          <h2 class="section-title">Sensor Data</h2>
          <div class="sensors-grid">
            <div class="sensor-card">
              <div class="sensor-icon air-quality">
                <i class="fas fa-smog"></i>
              </div>
              <div class="sensor-content">
                <p class="sensor-label">Kualitas Udara</p>
                <h3 id="gas-val" class="sensor-value">0</h3>
                <span class="sensor-unit">PPM</span>
              </div>
            </div>

            <div class="sensor-card">
              <div class="sensor-icon temperature">
                <i class="fas fa-thermometer-half"></i>
              </div>
              <div class="sensor-content">
                <p class="sensor-label">Temperatur</p>
                <h3 id="temp-val" class="sensor-value">0.0</h3>
                <span class="sensor-unit">°C</span>
              </div>
            </div>

            <div class="sensor-card">
              <div class="sensor-icon alarm">
                <i class="fas fa-bell"></i>
              </div>
              <div class="sensor-content">
                <p class="sensor-label">Sistem Alarm</p>
                <h3 id="buzzer-status" class="sensor-value">AMAN</h3>
              </div>
            </div>
          </div>
        </section>

        <!-- VIDEO SECTION -->
        <section class="video-section">
          <h2 class="section-title">Live AI Vision</h2>
          <div class="video-card">
            <div class="video-header">
              <div class="video-title">
                <i class="fas fa-video"></i>
                <span>YOLOv8 Detection Stream</span>
              </div>
              <span class="live-indicator">
                <span class="live-dot"></span> LIVE
              </span>
            </div>
            <div class="video-container">
              <img
                id="yolo-stream"
                src="http://localhost:5000/video"
                alt="Stream YOLO"
              />
            </div>
          </div>
        </section>

        <!-- LOG SECTION -->
        <section class="log-section">
          <div class="log-header-top">
            <h2 class="section-title">Event Logs</h2>
            <div class="log-actions">
              <button class="btn btn-primary" onclick="downloadPDF()">
                <i class="fas fa-file-pdf"></i> Export PDF
              </button>
              <button class="btn btn-danger" onclick="clearDatabase()">
                <i class="fas fa-trash"></i> Clear All
              </button>
            </div>
          </div>
          
          <div class="log-card">
            <ul id="log-list" class="log-list">
              <li class="log-empty">Menunggu data...</li>
            </ul>
          </div>
        </section>
      </main>
    </div>

    <script src="main.js"></script>
  </body>
</html>
