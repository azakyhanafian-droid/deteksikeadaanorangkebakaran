<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>AI & IoT Glass Dashboard</title>

    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>

  <body>
    <div class="container">
      <header>
        <h1><i class="fas fa-shield-halved"></i> AI SMART MONITOR</h1>
        <div id="status" class="status-badge">Menghubungkan...</div>
      </header>

      <div class="dashboard-grid">
        <!-- SENSOR -->
        <div class="sensor-container">
          <div class="card">
            <i class="fas fa-smog"></i>
            <p>Kualitas Udara</p>
            <h2 id="gas-val">0</h2>
          </div>

          <div class="card">
            <i class="fas fa-thermometer-half"></i>
            <p>Temperatur</p>
            <h2 id="temp-val">0.0</h2>
          </div>

          <div class="card">
            <i class="fas fa-bell"></i>
            <p>Sistem Alarm</p>
            <h2 id="buzzer-status">AMAN</h2>
          </div>
        </div>

        <!-- VIDEO YOLO -->
        <div class="video-container">
          <div class="card vid-card">
            <div class="vid-header">
              <span><i class="fas fa-video"></i> LIVE AI VISION - YOLOv8</span>
            </div>

            <img
              id="yolo-stream"
              src="http://localhost:5000/video"
              alt="Stream YOLO"
            />
          </div>
        </div>
      </div>

      <!-- LOG DATABASE -->
      <div class="card log-card">
        <div class="vid-header">
          <span><i class="fas fa-database"></i> LOG KEJADIAN</span>
        </div>

        <!-- 🔥 BUTTON DOWNLOAD -->
        <button
          onclick="downloadPDF()"
          style="margin: 10px 0; padding: 8px 15px; cursor: pointer"
        >
          <i class="fas fa-file-pdf"></i> Download Laporan PDF
        </button>
        <button
          onclick="clearDatabase()"
          style="background: red; color: white; padding: 8px"
        >
          🧨 Clear Database
        </button>

        <ul
          id="log-list"
          style="max-height: 250px; overflow-y: auto; padding: 10px"
        >
          <li>Menunggu data...</li>
        </ul>
      </div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
